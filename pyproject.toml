[project]
name = "voxelfc"
version = "0.1.0"
description = "VOXEL FC (File Companion): downloads audio, transcribes it, diarizes speakers, and uploads the results back."
requires-python = ">=3.10"
dependencies = [
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dropbox = ["dropbox>=11.36.0"]
transcribe = ["faster-whisper>=1.0.0"]
diarize = ["pyannote.audio>=3.1.0", "torch>=2.1.0"]
# Only needed on Linux/Windows machines with an NVIDIA GPU: provides
# libcublas.so.12 and libcudnn, which ctranslate2 (faster-whisper's backend)
# loads at runtime and which don't come bundled with the torch wheel.
# install.sh/install.ps1 add this extra automatically when they detect an
# NVIDIA GPU.
cuda = ["nvidia-cublas-cu12", "nvidia-cudnn-cu12==9.*"]
# Only installable/usable on Apple Silicon: runs transcription on the
# GPU/Neural Engine instead of CPU-only faster-whisper, reportedly 2-4x
# faster there. Used automatically when installed (transcribe.py falls
# back to faster-whisper on any failure). install.sh adds this extra
# automatically on macOS arm64.
mlx = ["mlx-whisper; sys_platform == 'darwin' and platform_machine == 'arm64'"]
# Not installed by install.sh/install.ps1 - only needed to run the test
# suite (pytest -q). Install with: pip install -e ".[dev]"
dev = ["pytest>=7.0.0"]
all = [
    "dropbox>=11.36.0",
    "faster-whisper>=1.0.0",
    "pyannote.audio>=3.1.0",
    "torch>=2.1.0",
]

[project.scripts]
voxelfc = "voxelfc.cli:main"
# Deprecated compatibility alias; remove after all machines migrate.
supertranscriptfc = "voxelfc.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
